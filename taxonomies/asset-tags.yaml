# StudioBrain asset-tag taxonomy v1 (SBAI-7726).
#
# Pure data. This is the controlled vocabulary the on-device SigLIP-2 quick
# tagger scores every asset against, and the same vocabulary the server tier
# normalises its output to (SBAI-7728). It is deliberately NOT code: the
# desktop Rust three-tier tagger's hard-coded TAG_VOCABULARY
# (studiobrain-app/packages/desktop/src-tauri/src/asset_tagger.rs:36-92) is
# the thing this file replaces, and every runtime now reads the vocabulary
# from here instead of embedding its own copy.
#
# Seed provenance:
#   * axes objects / style / mood / setting / composition -- the 50 snake_case
#     terms of that TAG_VOCABULARY, term-for-term, ids unchanged so tags
#     already written by the desktop tagger keep matching.
#   * axes colors / details -- the cloud assets-worker analysis axes
#     (studiobrain-cloud .../assets-worker/src/contract.ts AssetAnalysisV1:
#     description/tags/colors/style/mood/composition/details), so an
#     on-device analysis can populate the same fields the cloud shape has.
#
# Scoring contract (spec SBAI-7726 §4/§5):
#   candidate text = hypothesis_template with `{}` replaced by the term's
#   `prompt`. The prompt carries its own article/inflection so one template
#   per axis stays grammatical for every term in that axis. Those exact
#   strings -- not the ids -- are what gets embedded; `taxonomies/
#   asset-tags.embeddings.json` stores one 768-d fp32 vector per label in the
#   axis/term order below, and the device only ever runs the SigLIP vision
#   tower. `id` is `<axis>/<term>`; `term` alone is what lands in
#   `assets.tags` (case-sensitive LIKE match, so ids stay snake_case).
#
# `content_hash` covers ONLY the canonical form of the `axes` block (JSON,
# each term reduced to {id, prompt}), so it can live in the same file it
# stamps. Axis order and term order are BOTH part of that pre-image, because
# the artifact stores one vector per label in exactly that order -- swapping
# two axes re-pairs every vector with a different label, so the hash has to
# move when it happens. scripts/validate.py recomputes and enforces it,
# and the embeddings artifact must carry the same hash -- that pair is the
# staleness check: change a prompt, the hash moves, the artifact is stale
# until regenerated with scripts/generate_taxonomy_embeddings.py.
# `revision` is the human-facing semver; bump minor when terms are added,
# major when an existing term id changes meaning or disappears.
id: studiobrain.asset-tags
kind: taxonomy
display: StudioBrain Asset Tags
description: >-
  Controlled vocabulary for zero-shot asset tagging (objects, style, mood,
  setting, composition, colors, details).
revision: 1.0.0
content_hash: sha256:656eea8dcb2c89d4bbae4560a79c18293e79cd2fe0a20abdc27094d6c5d0aef2
