[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studiobrain-templates"
version = "0.3.0"
description = "StudioBrain entity templates, generation rules, and catalog data"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Biloxi Studios Inc."}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/BiloxiStudios/studiobrain-templates"

[tool.setuptools.packages.find]
where = ["."]
include = ["studiobrain_templates*"]

[tool.setuptools.package-data]
studiobrain_templates = [
    "templates/**/*.md",
    "templates/**/*.json",
    "templates/**/*.yaml",
    "templates/**/*.yml",
    "rules/**/*.md",
    "rules/**/*.yaml",
    "rules/**/*.yml",
    "schemas/**/*.json",
    "skills/**/*.yaml",
    "skills/**/*.yml",
    "taxonomies/**/*.yaml",
    "taxonomies/**/*.yml",
    # Precomputed zero-shot text embeddings (SBAI-7726). Data, not a binary:
    # JSON arrays of fp32 label vectors plus the model's sigmoid calibration.
    "taxonomies/**/*.json",
]

[project.optional-dependencies]
validate = [
    "jsonschema>=4.17",
    "pyyaml>=6.0",
]
