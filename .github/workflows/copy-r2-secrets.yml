# One-shot / rotation helper (SBAI-7665). workflow_dispatch only — never
# pull_request — so R2 credentials stay unreachable from a forked PR.
# Copies the proven templates plugins-publish R2 token onto the official
# plugins env and the community registry repo.
name: Copy catalog R2 secrets
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: plugins-env,community"
        default: "plugins-env,community"
        required: false

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: plugins-publish
    permissions:
      contents: read
    steps:
      - name: Copy R2 credentials to catalog publish repos
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GH_ADMIN_PAT is not set on plugins-publish"
            exit 1
          fi
          copy_four() {
            local dest="$1"
            shift
            printf '%s' "$R2_ACCOUNT_ID" | gh secret set R2_ACCOUNT_ID $dest --body-file -
            printf '%s' "$R2_ACCESS_KEY_ID" | gh secret set R2_ACCESS_KEY_ID $dest --body-file -
            printf '%s' "$R2_SECRET_ACCESS_KEY" | gh secret set R2_SECRET_ACCESS_KEY $dest --body-file -
            printf '%s' "$R2_BUCKET" | gh secret set R2_BUCKET $dest --body-file -
            echo "copied four R2 secrets -> $dest"
          }
          IFS=',' read -ra ITEMS <<< "${TARGETS}"
          for item in "${ITEMS[@]}"; do
            item="$(echo "$item" | xargs)"
            case "$item" in
              plugins-env)
                copy_four "--repo BiloxiStudios/studiobrain-plugins --env plugins-publish"
                ;;
              community)
                copy_four "--repo BiloxiStudios/studiobrain-community-plugins"
                ;;
              *)
                echo "unknown target: $item"
                exit 1
                ;;
            esac
          done
