name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 * * * *"

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate YAML frontmatter in all templates
        run: |
          python3 -c "
          import yaml, sys, pathlib

          SKIP_FILES = {'README.md'}

          errors = []
          for md in sorted(pathlib.Path('templates').rglob('*.md')):
              if md.name in SKIP_FILES:
                  continue
              text = md.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  errors.append(f'{md}: missing YAML frontmatter delimiter')
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{md}: malformed frontmatter (no closing ---)')
                  continue
              try:
                  data = yaml.safe_load(parts[1])
                  if not isinstance(data, dict):
                      errors.append(f'{md}: frontmatter is not a YAML mapping')
              except yaml.YAMLError as e:
                  errors.append(f'{md}: YAML parse error: {e}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          else:
              print(f'All templates valid.')
          "

  validate-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate YAML frontmatter in all rules
        run: |
          python3 -c "
          import yaml, sys, pathlib

          SKIP_FILES = {'README.md', 'RULES_INDEX.md'}

          errors = []
          for md in sorted(pathlib.Path('rules').rglob('*.md')):
              if md.name in SKIP_FILES:
                  continue
              text = md.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  errors.append(f'{md}: missing YAML frontmatter delimiter')
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{md}: malformed frontmatter (no closing ---)')
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f'{md}: YAML parse error: {e}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          else:
              print(f'All rules valid.')
          "

  validate-schemas-and-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "jsonschema>=4.17" "referencing>=0.30" pyyaml
      - name: Prove PR-controlled workflow changes cannot reach publish secrets
        # Secret-free. Fails a PR that puts secrets.* on a pull_request-reachable job.
        run: python3 scripts/check_workflow_secret_isolation.py
      - name: Run all scripts/tests unit tests
        # Broadened from a single-file pattern (test_publish_catalog_index_to_r2.py
        # only) so every regression suite under scripts/tests -- including
        # test_validate_in_app.py, test_validate_taxonomy.py, and this
        # ticket's test_build_catalog_index.py -- actually runs in CI instead
        # of being silently skipped by discovery (SBAI-7675).
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run scripts/validate.py (schema shape + instance validation + semver compat + fixtures)
        # --allow-missing-compat grandfathers existing assets that pre-date the
        # compat.min_core_version requirement (see SBAI-4649). New assets MUST
        # declare compat.min_core_version. Remove this flag once SBAI-4649 lands.
        # --fixtures validates adversarial fixture files in schemas/fixtures/.
        run: |
          python3 scripts/validate.py --allow-missing-compat --fixtures

  # Catalog badge index (SBAI-7611 / SBAI-7665). Rebuilt deterministically on
  # every push to main and every hourly schedule (generated_at pins to the
  # commit timestamp), then uploaded to R2 at catalog/catalog-index.json.
  # Since SBAI-8394 (PR #95) enabled required-status-check + enforce_admins
  # branch protection on main, the bot can no longer push directly to main.
  # Instead, it creates a PR with auto-merge enabled; once status checks pass,
  # GitHub auto-merges the PR. PRs never see R2 secrets.
  regenerate-catalog-index:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    environment: plugins-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml boto3
      - name: Compute a deterministic timestamp from the commit
        # Two runs of the SAME commit must produce a byte-identical index.
        run: |
          GENERATED_AT=$(date -u -d "@$(git show -s --format=%ct "${{ github.sha }}")" +%Y-%m-%dT%H:%M:%SZ)
          echo "GENERATED_AT=$GENERATED_AT" >> "$GITHUB_ENV"
      - name: Regenerate the catalog index from this commit
        run: python3 scripts/build_catalog_index.py --generated-at "$GENERATED_AT" --out /tmp/catalog-index.json
      - name: Create PR with auto-merge if catalog-index.json changed
        # Protected-branch-compatible commit-back: create a PR with auto-merge
        # enabled. Once required status checks pass, GitHub auto-merges.
        # Idempotent: skips PR creation if the index is unchanged vs main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="bot/catalog-index-update"

          # Fetch current main to compare against
          git fetch origin main

          # Check if catalog-index.json differs from main
          if git diff --quiet origin/main -- catalog-index.json; then
            # No change vs main - check if a stale PR exists and delete it
            echo "Catalog index unchanged vs origin/main."
            EXISTING_PR=$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")
            if [[ -n "$EXISTING_PR" ]]; then
              echo "Deleting stale PR #$EXISTING_PR (index unchanged)..."
              gh pr close "$EXISTING_PR" --delete-branch
            fi
          else
            # Changed - create/update PR with auto-merge
            cp /tmp/catalog-index.json catalog-index.json
            git config user.name "studiobrain-templates-ci[bot]"
            git config user.email "ci@studiobrain.ai"

            # Create or reuse the branch
            git fetch origin "$BRANCH_NAME" || true
            if git show-ref --verify --quiet refs/remotes/origin/"$BRANCH_NAME"; then
              git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
            else
              git checkout -B "$BRANCH_NAME" origin/main
            fi

            # Stage the change
            git add catalog-index.json
            if ! git diff --cached --quiet; then
              git commit -m "SBAI-7611: regenerate catalog index [skip ci]"
              git push -u origin "$BRANCH_NAME" --force

              # Check for existing open PR
              EXISTING_PR=$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")
              if [[ -n "$EXISTING_PR" ]]; then
                echo "PR #$EXISTING_PR already exists for $BRANCH_NAME"
              else
                # Create new PR with auto-merge enabled
                gh pr create \
                  --base main \
                  --head "$BRANCH_NAME" \
                  --title "SBAI-7611: regenerate catalog index [skip ci]" \
                  --body "Auto-generated PR to update catalog-index.json

          This PR was created by CI to update the catalog index. It will auto-merge once required status checks pass.

          - Generated at: $GENERATED_AT
          - Commit: ${{ github.sha }}" \
                  --auto
                echo "Created PR for catalog index update with auto-merge enabled"
              fi
            else
              echo "No changes to commit"
            fi
          fi
      - name: Publish catalog-index.json to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          python3 scripts/publish_catalog_index_to_r2.py \
            --file catalog-index.json \
            --key catalog/catalog-index.json
