name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate YAML frontmatter in all templates
        run: |
          python3 -c "
          import yaml, sys, pathlib

          SKIP_FILES = {'README.md'}

          errors = []
          for md in sorted(pathlib.Path('templates').rglob('*.md')):
              if md.name in SKIP_FILES:
                  continue
              text = md.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  errors.append(f'{md}: missing YAML frontmatter delimiter')
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{md}: malformed frontmatter (no closing ---)')
                  continue
              try:
                  data = yaml.safe_load(parts[1])
                  if not isinstance(data, dict):
                      errors.append(f'{md}: frontmatter is not a YAML mapping')
              except yaml.YAMLError as e:
                  errors.append(f'{md}: YAML parse error: {e}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          else:
              print(f'All templates valid.')
          "

  validate-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate YAML frontmatter in all rules
        run: |
          python3 -c "
          import yaml, sys, pathlib

          SKIP_FILES = {'README.md', 'RULES_INDEX.md'}

          errors = []
          for md in sorted(pathlib.Path('rules').rglob('*.md')):
              if md.name in SKIP_FILES:
                  continue
              text = md.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  errors.append(f'{md}: missing YAML frontmatter delimiter')
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{md}: malformed frontmatter (no closing ---)')
                  continue
              try:
                  yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f'{md}: YAML parse error: {e}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          else:
              print(f'All rules valid.')
          "

  validate-schemas-and-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "jsonschema>=4.17" "referencing>=0.30" pyyaml
      - name: Run scripts/validate.py (schema shape + instance validation + semver compat + fixtures)
        # --allow-missing-compat grandfathers existing assets that pre-date the
        # compat.min_core_version requirement (see SBAI-4649). New assets MUST
        # declare compat.min_core_version. Remove this flag once SBAI-4649 lands.
        # --fixtures validates adversarial fixture files in schemas/fixtures/.
        run: |
          python3 scripts/validate.py --allow-missing-compat --fixtures

  # ─────────────────────────────────────────────────────────────────────────
  # Plugin v2 build/publish pipeline (SBAI-7183).
  #
  # Three-job split is deliberate and is itself the security boundary:
  #   1. check-plugin-ci-security / build-smoke-plugins run on EVERY push and
  #      pull_request (including forked PRs) and reference NO secrets. This
  #      is what makes it safe to run untrusted PR code through build+smoke.
  #   2. publish-plugins-to-r2 is gated to push-to-main only and is the ONLY
  #      job that reads publish/signing secrets.
  # scripts/check_workflow_secret_isolation.py enforces this split on every
  # PR: it fails CI if any pull_request-reachable job in this file ever
  # references a secret other than GITHUB_TOKEN.
  # ─────────────────────────────────────────────────────────────────────────

  check-plugin-ci-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "jsonschema>=4.17" "referencing>=0.30" pyyaml cryptography boto3
      - name: Prove PR-controlled workflow changes cannot reach publish/signing secrets
        run: python3 scripts/check_workflow_secret_isolation.py
      - name: Prove the index sign->verify->tamper-detect pipeline actually works
        run: python3 scripts/verify_index_signature.py --selftest
      - name: Unit tests (build pipeline + secret-isolation checker)
        run: python3 -m unittest discover -s scripts/tests -v

  build-smoke-plugins:
    runs-on: ubuntu-latest
    needs: [check-plugin-ci-security]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install "jsonschema>=4.17" "referencing>=0.30" pyyaml
      - name: Compute a deterministic build timestamp from the commit
        # Two CI runs for the SAME commit must produce a byte-identical
        # index (manager review, SBAI-7183) — `date -u +%s`/wall-clock at
        # build time is NOT reproducible across runs. The commit's own
        # author timestamp is a stable, commit-derived value instead.
        run: |
          BUILT_AT=$(date -u -d "@$(git show -s --format=%ct "${{ github.sha }}")" +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILT_AT=$BUILT_AT" >> "$GITHUB_ENV"
      - name: Validate manifest_version=2 plugins, build + smoke-test surface artifacts
        run: |
          python3 scripts/build_plugin_artifacts.py \
            --out dist \
            --built-at "$BUILT_AT" \
            --source-commit "${{ github.sha }}" \
            --public-base-url "${{ vars.R2_PUBLIC_BASE_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: dist/
          retention-days: 14

  publish-plugins-to-r2:
    runs-on: ubuntu-latest
    needs: [check-plugin-ci-security, build-smoke-plugins]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: plugins-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install "jsonschema>=4.17" "referencing>=0.30" pyyaml cryptography boto3
      - name: Compute a deterministic build timestamp from the commit
        # Same derivation as build-smoke-plugins, so a manual rerun of this
        # job on an unchanged commit re-signs a byte-identical index instead
        # of drifting on generated_at (manager review, SBAI-7183).
        run: |
          BUILT_AT=$(date -u -d "@$(git show -s --format=%ct "${{ github.sha }}")" +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILT_AT=$BUILT_AT" >> "$GITHUB_ENV"
      - name: Rebuild dist/ from this exact commit (deterministic, never trust a prior job's artifact for publish)
        run: |
          python3 scripts/build_plugin_artifacts.py \
            --out dist \
            --built-at "$BUILT_AT" \
            --source-commit "${{ github.sha }}" \
            --public-base-url "${{ vars.R2_PUBLIC_BASE_URL }}"
      - name: Sign the index
        env:
          PLUGIN_INDEX_SIGNING_KEY: ${{ secrets.PLUGIN_INDEX_SIGNING_KEY }}
        run: |
          python3 scripts/sign_index.py \
            --index dist/_plugins.index.json \
            --key-id sb-templates-ci-index-2026 \
            --signing-key-b64 "$PLUGIN_INDEX_SIGNING_KEY"
      - name: Verify the signature we just produced against the checked-in public key
        run: python3 scripts/verify_index_signature.py --index dist/_plugins.index.json
      - name: Publish immutable versioned artifacts + signed index to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/publish_to_r2.py --dist dist
      - name: Commit the freshly-signed index back to main (source-of-truth copy alongside the R2 copy)
        # Rebase-proof commit-back (SBAI-7183): main may have advanced past this
        # run's head by the time we push (a prior index commit, a concurrent
        # merge, or a manual rerun of this very job). Committing from the
        # CURRENT tip of origin/main instead of the run's checkout makes the
        # push always-fast-forward, and because signing is deterministic
        # (signed_at pins to the commit-derived generated_at), a rerun of an
        # unchanged commit finds the identical index already on main and
        # no-ops — the idempotent-rerun witness. The old form
        # (`git push origin HEAD:main` from the run-head checkout) failed
        # non-fast-forward exactly this way on 2026-08-19 (run 32245077450).
        run: |
          git fetch origin main
          git checkout -B index-update origin/main
          cp dist/_plugins.index.json _plugins.index.json
          git config user.name "studiobrain-templates-ci[bot]"
          git config user.email "ci@studiobrain.ai"
          git add _plugins.index.json
          if git diff --cached --quiet; then
            echo "Index unchanged — this commit's deterministic index is already on main (idempotent rerun confirmed)."
          else
            git commit -m "SBAI-7183: regenerate signed plugin index [skip ci]"
            git push origin HEAD:main
          fi

  # Catalog badge index (SBAI-7611, epic SBAI-7608). Kept fresh the same way
  # as the signed plugin index: rebuilt deterministically on every push to
  # main (generated_at pins to the commit timestamp) and committed back with
  # the same rebase-proof, idempotent-rerun pattern. PRs need no staleness
  # gate — the index self-heals on merge to main, and scripts/validate.py
  # (validate-schemas-and-assets) already fails a PR whose catalog edits are
  # inconsistent with the checked-in index. No secrets: this job only reads
  # the repo and pushes the regenerated file.
  regenerate-catalog-index:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Compute a deterministic timestamp from the commit
        # Same derivation as build-smoke-plugins (BUILT_AT) — two runs of the
        # SAME commit must produce a byte-identical index.
        run: |
          GENERATED_AT=$(date -u -d "@$(git show -s --format=%ct "${{ github.sha }}")" +%Y-%m-%dT%H:%M:%SZ)
          echo "GENERATED_AT=$GENERATED_AT" >> "$GITHUB_ENV"
      - name: Regenerate the catalog index from this commit
        run: python3 scripts/build_catalog_index.py --generated-at "$GENERATED_AT" --out /tmp/catalog-index.json
      - name: Commit the regenerated index back to main
        # Rebase-proof commit-back, mirroring _plugins.index.json above:
        # commit from the CURRENT tip of origin/main so the push is always
        # fast-forward, and no-op when the deterministic index is already
        # there (idempotent-rerun witness).
        run: |
          git fetch origin main
          git checkout -B catalog-index-update origin/main
          cp /tmp/catalog-index.json catalog-index.json
          git config user.name "studiobrain-templates-ci[bot]"
          git config user.email "ci@studiobrain.ai"
          git add catalog-index.json
          if git diff --cached --quiet; then
            echo "Catalog index unchanged — this commit's deterministic index is already on main (idempotent rerun confirmed)."
          else
            git commit -m "SBAI-7611: regenerate catalog index [skip ci]"
            git push origin HEAD:main
          fi
