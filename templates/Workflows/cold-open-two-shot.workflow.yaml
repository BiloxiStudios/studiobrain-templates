# TV domain: clone of the gold scene-with-two-leads, framed as an episodic
# cold open — reuse the location exterior, seat the two leads, animate.
id: cold-open-two-shot
kind: workflow
name: Cold open two-shot
label: Cold open with two leads
description: Episodic cold open — location exterior, two series leads composited in, animated two-shot.
domains: [tv]
entity_types: [location, character]

requires:
  platforms: [desktop]   # comfyui is localhost
  env: [FAL_KEY]         # kling

slots:
  place:
    modality: image
    ref: entity.location.exterior_image
    optional: true
  look:
    modality: text
    ref: entity.location.description
  lead_a:
    modality: image
    ref: entity.character[0].primary_image
  lead_b:
    modality: image
    ref: entity.character[1].primary_image
  still:
    modality: image
  clip:
    modality: video
    out: entity.location.cold_open_video

steps:
  - id: paint-location
    provider: comfyui
    in:
      prompt: look
    out:
      image: place
    skip_if: place
  - id: composite
    provider: comfyui
    in:
      background: place
      subjects: [lead_a, lead_b]
    out:
      image: still
  - id: animate
    provider: kling
    in:
      image: still
      prompt: look
    out:
      video: clip
