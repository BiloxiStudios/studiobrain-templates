# Music domain: song/album description -> art-direction text -> cover image.
# Text hop keeps the image prompt on-brief; swap openai/fal endpoints freely.
id: cover-from-track
kind: workflow
name: Cover art from track
label: Cover from track
description: Turn a track or album description into cover art via a short art-direction pass.
domains: [music]
entity_types: [item]

requires:
  env: [OPENAI_API_KEY, FAL_KEY]   # openai + fal

slots:
  brief:
    modality: text
    ref: entity.item.description
  concept:
    modality: text
  cover:
    modality: image
    out: entity.item.primary_image

steps:
  - id: art-direction
    provider: openai
    in:
      prompt: brief
    out:
      text: concept
  - id: cover-art
    provider: fal
    in:
      prompt: concept
    out:
      image: cover
    skip_if: cover
