# fal.ai queue. Swap endpoint per model (flux, kling, hunyuan-video, …).
id: fal
kind: provider
display: fal.ai
wire: http
base_url: https://fal.run
endpoint: /fal-ai/flux/dev
auth:
  header: Authorization
  scheme: Key
  env: FAL_KEY
request:
  method: POST
  body:
    prompt: "{{prompt}}"
response:
  image_url_path: images.0.url
slots:
  accepts: [text, image, audio]
  emits: [image, video, audio]
requires:
  env: [FAL_KEY]
