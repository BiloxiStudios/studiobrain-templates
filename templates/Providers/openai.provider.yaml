id: openai
kind: provider
display: OpenAI
wire: openai-compat
engine:
  category: llm_router
  requirement: preferred
route: aigateway
starter: true
base_url: https://gateway.ai.cloudflare.com/v1/{{account_id}}/{{gateway_name}}/compat
endpoint: /chat/completions
response:
  text_path: choices.0.message.content
provides: [llm-chat]
billing: [brainbits, byok]
models:
  endpoint: /models
  refresh: 24h
chat:
  nativeChatPath: chat/completions
  modelPrefixes: [gpt-, o1-, o3-, o4-]
