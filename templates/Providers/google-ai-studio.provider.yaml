id: google-ai-studio
kind: provider
display: Google Gemini
wire: openai-compat
engine:
  category: llm_router
  requirement: preferred
route: aigateway
base_url: https://gateway.ai.cloudflare.com/v1/{{account_id}}/{{gateway_name}}/compat
endpoint: /chat/completions
response:
  text_path: choices.0.message.content
provides: [llm-chat]
billing: [brainbits, byok]
models:
  endpoint: /models
  refresh: 24h
chat:
  nativeChatPath: chat/completions
  modelPrefixes: [gemini-]
model_metadata:
  # Text and image inputs can produce interleaved text and images. The model
  # card marks function calling and structured outputs unsupported.
  # https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-image
  gemini-2.5-flash-image:
    modalities: [text, image]
    capabilities: [image-gen, image-input]
  # https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/2-5-pro
  gemini-2.5-pro:
    capabilities: [structured-output, tools, image-input, audio-input]
    verified_for: [fusion, import]
    max_output_tokens: 65536
  # SBAI-15092: the current models the owner confirmed for Fusion, import and
  # entity generation (2026-11-20). Limits and capabilities are what the
  # Cloudflare AI model page of each model states (read 2026-11-20). Nothing a
  # page does not state is claimed, with one exception: `structured-output`
  # is owner-confirmed 2026-11-20 where the page lists no structured-output
  # parameter. A limit the page does not give as a number is left out.
  # https://developers.cloudflare.com/ai/models/google/gemini-4-carbon/
  # Page: "Google's most capable Gemini 4 reasoning model", context window
  # 1,048,576 tokens, parameters list `tools` and `response_format`. The page
  # says "long outputs up to 1M tokens" and gives no exact maximum, so
  # max_output_tokens is left out. No image or audio input is stated.
  gemini-4-carbon:
    capabilities: [structured-output, tools]
    verified_for: [fusion, import, entity-generation]
    context_tokens: 1048576
  # https://developers.cloudflare.com/ai/models/google/gemini-4-argon/
  # Page: "The first model in the Gemini 4 family", context window 1,048,576
  # tokens, parameters list `tools` and `response_format`. No maximum output
  # and no image or audio input is stated.
  gemini-4-argon:
    capabilities: [structured-output, tools]
    verified_for: [fusion, import, entity-generation]
    context_tokens: 1048576
