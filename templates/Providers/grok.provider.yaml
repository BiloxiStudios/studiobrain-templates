# xAI Grok. OpenAI-compatible chat plus image and video generation on the same
# key. Contracts: https://docs.x.ai/docs/api-reference (chat + POST
# /v1/images/generations) and https://docs.x.ai/docs/guides/video-generations
# (grok-imagine-video -- async, the client polls until the video URL is ready).
id: grok
kind: provider
display: xAI Grok
wire: openai-compat
engine:
  category: llm_router
  requirement: preferred
route: aigateway
starter: true
base_url: https://gateway.ai.cloudflare.com/v1/{{account_id}}/{{gateway_name}}/compat
endpoint: /chat/completions
response:
  text_path: choices.0.message.content
provides: [llm-chat, image-gen, video-gen]
billing: [brainbits, byok]
models:
  endpoint: /models
  refresh: 24h
chat:
  nativeChatPath: chat/completions
  modelPrefixes: [grok-]
slots:
  accepts: [text, image]
  emits: [text, image, video]
model_metadata:
  # SBAI-15092: the current models the owner confirmed for Fusion, import and
  # entity generation (2026-11-20). Limits and capabilities are what the
  # Cloudflare AI model page of each model states (read 2026-11-20). Nothing a
  # page does not state is claimed, with one exception: `structured-output`
  # is owner-confirmed 2026-11-20 where the page lists no structured-output
  # parameter. A limit the page does not give as a number is left out.
  # https://developers.cloudflare.com/ai/models/xai/grok-4.7/
  # Page: context window 500,000 tokens, "Accepts text and image inputs, and
  # supports function calling, structured outputs". No maximum output is
  # stated.
  grok-4.7:
    capabilities: [structured-output, tools, image-input]
    verified_for: [fusion, import, entity-generation]
    context_tokens: 500000
