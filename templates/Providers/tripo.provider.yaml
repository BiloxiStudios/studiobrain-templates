# Tripo text-to-3D. Create returns a task_id; poll GET /v3/tasks/{id}
# until data.status == success, then take data.output.model_url (GLB).
id: tripo
kind: provider
display: Tripo 3D
wire: http
base_url: https://openapi.tripo3d.ai
endpoint: /v3/generation/text-to-model
auth:
  header: Authorization
  scheme: Bearer
  env: TRIPO_API_KEY
request:
  method: POST
  body:
    prompt: "{{prompt}}"
    model: v3.1-20260211
    texture: true
    pbr: true
response:
  image_url_path: data.output.model_url
