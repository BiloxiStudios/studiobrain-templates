id: ollama
kind: provider
display: Ollama
wire: openai-compat
base_url: http://127.0.0.1:11434
endpoint: /v1/chat/completions
response:
  text_path: choices.0.message.content
requires:
  platforms: [desktop]
provides: [llm-chat]
models:
  endpoint: /v1/models
  refresh: 24h
chat:
  nativeChatPath: v1/chat/completions
  modelPrefixes: []
