id: http
kind: provider
display: Generic HTTP
wire: http
engine:
  category: lan_endpoint
  requirement: preferred
endpoint: /generate
auth:
  header: Authorization
  scheme: Bearer
  env: CUSTOM_HTTP_KEY
request:
  method: POST
  body:
    prompt: "{{prompt}}"
response:
  text_path: text
requires:
  env: [CUSTOM_HTTP_KEY]
provides: [llm-chat]   # generic catch-all template; override when copying
