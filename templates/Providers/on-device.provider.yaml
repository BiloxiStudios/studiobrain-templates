  # NO larger "quality" tier, and that is a decision rather than an omission.
  # selectWeights ranks by min_ram_gb DESCENDING when the device reports its
  # RAM, so any row declaring a higher floor becomes the AUTO-SELECTED default
  # on every machine that clears it. The candidates were priced:
  #     onnx-community/distil-small.en   q8         172,068,091 B  (English-only,
  #                                                 862 downloads, untouched
  #                                                 since 2024-10-08)
  #     onnx-community/whisper-small     q8         249,077,005 B  (q8 decoder --
  #                                                 gibberish on WebGPU, #1317)
  #     onnx-community/whisper-small     fp32+q4    585,975,197 B
  # Making any of those the default would hand a 0.6 GB download to someone who
  # tapped a mic button to dictate one sentence. Whisper-base is the dictation
  # tier on purpose; a quality tier belongs to a transcription FEATURE, with
  # its own opt-in, not to this capability's ladder.
  # (onnx-community/distil-whisper-small.en, distil-medium.en and
  # distil-large-v3 were checked and DO NOT EXIST -- the HF API 401s on all
  # three. The real distil ONNX id is onnx-community/distil-small.en.)
  # ---------------------------------------------------------------------------
  # runtime: litert-lm -- Google's LiteRT-LM WebGPU engine (SBAI-7844 §2).
  #
  # A SECOND in-app engine, not a replacement. `runtime` is declared per ROW
  # here (the provider header still says transformers.js) because this one
  # provider now holds tiers for both engines and the executor must load the
  # engine the SELECTED row names.
  #
  # SBAI-8406 (2026-08-26, owner witnessed): gemma-4-e2b-it-litert-web is
  # significantly faster than the ONNX equivalent on WebGPU hardware and is
  # now the DEFAULT in-app chat row. `experimental: true` removed; ONNX rows
  # become the implicit fallback (no `default` flag). E4B LiteRT stays
  # experimental -- it is the quality tier, not yet witnessed at the bench.
  # selectWeights sorts `default` first within each RAM tier; the E2B LiteRT
  # row wins for 8 GB devices and the E4B ONNX row wins for 16 GB devices
  # (the E4B LiteRT row loses the stable-sort tiebreak because it has no
  # `default` flag and sits after the ONNX E4B row in the file).
  #
  # `file` is required and is NOT decoration: litert-community repos publish
  # several mutually incompatible .litertlm builds side by side and only the
  # `-web` one runs in a browser. The others -- `-gpu`, plus per-vendor NPU
  # builds (Google Tensor G5, Intel LNL/PTL, Qualcomm qcs8275/sm8750) -- would
  # download gigabytes and then fail to load.
  #
  # TEXT-ONLY, and structurally so. Two independent confirmations:
  #   * @litert-lm/core 0.15.0 declares ImageContentPart / AudioContentPart /
  #     VideoContentPart as literal placeholders, each commented "not supported
  #     in JS yet" (conversation_config.d.ts).
  #   * The model card: "Web on LiteRT-LM uses a specially optimized model for
  #     Web because of its unique memory constraints. Currently the model is
  #     text-only."
  # So `modality: [text]` here is a hard fact about the weights, and the vision
  # / audio / encoder / STT capabilities above stay on transformers.js. The
  # executor refuses a multimodal gateway on these rows at construction.
  #
  # context_length is 32768, NOT Gemma's 131072 that the ONNX rows above
  # correctly declare. The model card says "The model can support up to 32k
  # context length", and LiteRT fixes maxNumTokens when the engine is created,
  # so a row claiming 128k would let the orchestrator fill a window the runtime
  # cannot hold. The SDK clamps to 32768 regardless; this row states the truth.
  #
  # tools: true -- WITNESSED 2026-08-26 (desktop-owner-test-2026-08-26, SBAI-8406).
  # The engine's tool support is real and STRUCTURED (preface.tools takes
  # OpenAI-shaped function declarations, enableConstrainedDecoding exists, and
  # calls return as message.tool_calls), and the SDK implements it. The gate
  # held until the owner closed a real tool loop on gemma-4-E2B-it-web.litertlm
  # in the StudioBrain desktop on 2026-08-26. This flip + the matching witness
  # in ondevice-gateway.ts (SBAI-8406-gemma4-litert-nav) are the witness record.
  #
  # approx_download_mb is the real byte size from the HF API, not an estimate:
  #     gemma-4-E2B-it-web.litertlm   2,008,432,640 B
  #     gemma-4-E4B-it-web.litertlm   2,969,059,328 B
  # Note the -web build is SMALLER than the bare .litertlm of the same tier
  # (2,588,147,712 B for E2B) -- it is the memory-optimized web variant.
  #
  # These weights DO NOT share a cache with the ONNX rows above: the engine
  # fetches the model with a plain fetch() and streams it into the runtime,
  # touching neither the Cache API nor the transformers.js browser cache. A
  # user who already downloaded Gemma for transformers.js pays again here.
  # Tracked as cache-dedupe work in SBAI-7670, deliberately not solved here.
  - id: on-device/gemma-4-e2b-it-litert-web
    source: huggingface://litert-community/gemma-4-E2B-it-litert-lm
