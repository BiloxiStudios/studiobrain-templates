# Zero-key, zero-install free tier: runs entirely on the user's device via
# the ai-sdk on-device executor (packages/ai-sdk/src/ondevice, SBAI-7625) --
# WebGPU with a WASM fallback, no network hop, never debited against
# BrainBits. wire: in-app follows the wire: process precedent: cloud workers
# must 501 it (they have no browser/device to run weights on). The
# WebGPU -> WASM -> model-manager -> cloud fallback ladder is policy that
# lives in the executor (resolver.ts), never in this file (WORKFLOW_RULES.md
# fallback-chain doctrine). Weight rows below are the static per-device
# matrix the executor selects from at runtime based on detected capability --
# they are not a live model list (that's what `models` is for elsewhere).
# Model capability metadata (context_length, max_output_tokens, tools,
# thinking) is declared per weight row, not per provider: tiers of the same
# family differ, and the executor must read the row it actually selected.
# Row ids are namespaced `on-device/...` so the cloud money-leak guard can
# reject the whole lane by prefix rather than by a list of bare slugs.
# Gemma 4 is an owner lock (2026-08-21, supersedes any earlier Gemma 3 body
# text): https://huggingface.co/blog/gemma4. Billing is intentionally
# omitted -- the user's own device is free (WORKFLOW_RULES.md:227).
# A row's `dtype` is an execution prerequisite, not a size preference: q4f16
# and fp16 rows need the WebGPU `shader-f16` feature and are skipped by
# selectWeights on any runtime that cannot prove it (SBAI-7682). Declare a
# runnable non-f16 row for every device tier, or that tier dead-ends after
# the user has already paid for the download.
#
# SBAI-7726 adds the asset-intelligence capabilities `asset-tagging` (SigLIP-2
# zero-shot scoring against taxonomies/asset-tags.yaml) and `asset-caption`
# (deep-tag captioner used when Gemma 4 is not cached). Two catalog rulings
# are load-bearing there and must not be quietly reversed:
#
#   * NO FastVLM row. onnx-community/FastVLM-0.5B-ONNX is the strongest small
#     captioner and has a working WebGPU demo, but it ships under `apple-amlr`
#     (Apple ML Research license, not OSI). This catalog is consumed by the
#     Apache-2.0 core product, so the license needs review before it becomes a
#     row. Florence-2-base-ft (MIT) is the caption tier until then.
#   * NO SigLIP-2 NaFlex row. onnx-community/siglip2-base-patch16-naflex-ONNX
#     is tagged exactly like its FixRes siblings, but its config declares
#     `model_type: siglip2`, which has no entry in the transformers.js v4
#     registry -- it fails at load, AFTER the download. Only FixRes SigLIP-2
#     repos (`model_type: siglip`) may be added here.
#
# Encoder rows (asset-tagging) deliberately omit context_length /
# max_output_tokens / tools / thinking: SigLIP is an image encoder scored
# against precomputed text embeddings, it has no chat window and emits no
# tokens. validate.py only demands those on `llm-chat` rows.
#
# SBAI-7837 adds `stt` -- Whisper dictation for the chat mic button. The
# division of labour with the audio rows above is deliberate and must not be
# collapsed: Whisper is FAST DICTATION (one encoder-decoder pass, ~76 MB), and
# Gemma 4's audio encoder is UNDERSTANDING (a full LLM decode per utterance,
# 30 s hard cap, no built-in windowing). Routing the mic button through Gemma
# would be the wrong tool at a large multiple of the cost.
id: on-device
kind: provider
display: On-Device AI (Free)
wire: in-app
runtime: transformers.js
provides: [llm-chat, embeddings, asset-tagging, asset-caption, stt]
slots:
  accepts: [text, image, audio]
  emits: [text, tool, json]
requires:
  platforms: [web, desktop, mobile]
  webgpu: optional
weights:
  - id: on-device/gemma-4-e4b-it-q4f16-webgpu
    source: huggingface://onnx-community/gemma-4-E4B-it-ONNX
    dtype: q4f16
    device: webgpu
    min_ram_gb: 16
    approx_download_mb: 4800
    capability: llm-chat
    context_length: 131072
    max_output_tokens: 8192
    tools: true
    thinking: optional
    modality: [text]
  - id: on-device/gemma-4-e2b-it-q4f16-webgpu
    source: huggingface://onnx-community/gemma-4-E2B-it-ONNX
    dtype: q4f16
    device: webgpu
    min_ram_gb: 8
    approx_download_mb: 2900
    capability: llm-chat
    context_length: 131072
    max_output_tokens: 8192
    tools: true
    thinking: optional
    default: true
    modality: [text]
  # SBAI-7682: the q4f16 rows above cannot execute on a WebGPU adapter that
  # does not expose the `shader-f16` feature -- ORT compiles their graphs to
  # half-precision shaders and aborts at OrtRun ("Program GatherBlockQuantized
  # requires f16 but the device does not support it"). The acceptance witness
  # hit exactly that on a hardware NVIDIA Blackwell adapter, after the ~3 GB
  # download. This is the q4 step-down the executor falls to; no suffix is
  # needed on the id now that there is only one Gemma q4 row.
  # approx_download_mb is the witnessed transfer: 3,646,875,754 bytes for
  # onnx/embed_tokens_q4 + onnx/decoder_model_merged_q4 + tokenizer + configs
  # at revision 9f4bef82ea6e296bc69f8a2f5939f73af81b07a6.
  - id: on-device/gemma-4-e2b-it-q4
    source: huggingface://onnx-community/gemma-4-E2B-it-ONNX
    dtype: q4
    device: webgpu
    min_ram_gb: 8
    approx_download_mb: 3647
    capability: llm-chat
    context_length: 131072
    max_output_tokens: 8192
    tools: true
    thinking: optional
    modality: [text]
  # SBAI-7682: there is deliberately NO Gemma 4 WASM row. ORT-web's WASM
  # execution provider has no GatherBlockQuantized kernel, so the q4 Gemma
  # graph cannot even create a session there ("Could not find an
  # implementation for GatherBlockQuantized(1)") -- witnessed after a 3.5 GB
  # in-browser download. The only Gemma variant WASM has kernels for is q8,
  # whose weights are ~9 GB, over the wasm32 4 GB ceiling. Qwen3-0.6B is the
  # WASM tier instead: q8 is plain per-tensor quantization on standard
  # kernels, and the same family completed the full entity.list round trip on
  # ORT-web/WASM during the witness. Not marked `fallback` -- this row IS the
  # WASM tier, so the executor may select it; it is labelled reduced-
  # capability by being visibly not Gemma.
  - id: on-device/qwen3-0.6b-q8-wasm
    source: huggingface://onnx-community/Qwen3-0.6B-ONNX
    dtype: q8
    device: wasm
    min_ram_gb: 4
    approx_download_mb: 630
    capability: llm-chat
    context_length: 32768
    max_output_tokens: 4096
    tools: true
    thinking: optional
    modality: [text]
  # Offered, never auto-selected (fallback: true). approx_download_mb
  # corrected in SBAI-7682: onnx/model_q4.onnx is 919,096,585 bytes, not the
  # ~500 MB originally declared -- q4 block quantization of this model is
  # LARGER than its q8 above.
  - id: on-device/qwen3-0.6b-q4-any
    source: huggingface://onnx-community/Qwen3-0.6B-ONNX
    dtype: q4
    device: any
    min_ram_gb: 4
    approx_download_mb: 930
    capability: llm-chat
    context_length: 32768
    max_output_tokens: 4096
    tools: true
    thinking: optional
    fallback: true
    modality: [text]
  - id: on-device/nomic-embed-text-v1.5-q8-any
    source: huggingface://nomic-ai/nomic-embed-text-v1.5
    dtype: q8
    device: any
    approx_download_mb: 140
    capability: embeddings
    context_length: 8192
    modality: [text]
  # ---------------------------------------------------------------------------
  # capability: asset-tagging -- SigLIP-2 zero-shot scoring (SBAI-7726 §5).
  #
  # These rows download the VISION TOWER ONLY (`model_file_name: vision_model`,
  # SiglipVisionModel). The text tower never ships: every taxonomy label is
  # embedded offline by scripts/generate_taxonomy_embeddings.py into the
  # artifact named by `taxonomy_embeddings`, which also carries the learned
  # `logit_scale` / `logit_bias` so the device's
  # sigmoid(scale*cos_sim + bias) reproduces pipeline probabilities. That is
  # what turns a 378 MB-1.07 GB combined model into a 55-95 MB download.
  # `taxonomy_embeddings` is per-tier, not per-taxonomy: base-256 embeds at
  # 768 dims and so400m at 1152, so a row must never point at the other tier's
  # artifact.
  #
  # Only FixRes SigLIP-2 repos belong here. The NaFlex variant
  # (siglip2-base-patch16-naflex-ONNX) declares `model_type: siglip2`, which
  # transformers.js v4 does not register -- it would fail at load after the
  # download completes.
  - id: on-device/siglip2-base-256-vision-q4f16-webgpu
    source: huggingface://onnx-community/siglip2-base-patch16-256-ONNX
    model_file_name: vision_model
    dtype: q4f16
    device: webgpu
    min_ram_gb: 4
    approx_download_mb: 55
    capability: asset-tagging
    taxonomy: studiobrain.asset-tags
    taxonomy_embeddings: taxonomies/asset-tags.embeddings.json
    modality: [image]
    default: true
  # The non-f16 WebGPU step-down (SBAI-7682 doctrine): plain q4 compiles to
  # fp32 shaders and runs on adapters without the `shader-f16` feature.
  - id: on-device/siglip2-base-256-vision-q4-webgpu
    source: huggingface://onnx-community/siglip2-base-patch16-256-ONNX
    model_file_name: vision_model
    dtype: q4
    device: webgpu
    min_ram_gb: 4
    approx_download_mb: 63
    capability: asset-tagging
    taxonomy: studiobrain.asset-tags
    taxonomy_embeddings: taxonomies/asset-tags.embeddings.json
    modality: [image]
  # The WASM tier. q4 cannot run on ORT-web's WASM execution provider (no
  # GatherBlockQuantized kernel), so this tier must be plain per-tensor int8;
  # `q8` resolves to vision_model_quantized.onnx, byte-identical to
  # vision_model_int8.onnx in this repo (94,737,653 B).
  - id: on-device/siglip2-base-256-vision-q8-wasm
    source: huggingface://onnx-community/siglip2-base-patch16-256-ONNX
    model_file_name: vision_model
    dtype: q8
    device: wasm
    min_ram_gb: 4
    approx_download_mb: 95
    capability: asset-tagging
    taxonomy: studiobrain.asset-tags
    taxonomy_embeddings: taxonomies/asset-tags.embeddings.json
    modality: [image]
  # Quality tier: so400m embeds at 1152 dims, so it needs its OWN artifact --
  # taxonomies/asset-tags.so400m.embeddings.json, produced by
  # `scripts/generate_taxonomy_embeddings.py --tier so400m`. Its text tower is
  # 711 MB int8 and must never be put on-device.
  - id: on-device/siglip2-so400m-256-vision-q4f16-webgpu
    source: huggingface://onnx-community/siglip2-so400m-patch16-256-ONNX
    model_file_name: vision_model
    dtype: q4f16
    device: webgpu
    min_ram_gb: 8
    approx_download_mb: 246
    capability: asset-tagging
    taxonomy: studiobrain.asset-tags
    taxonomy_embeddings: taxonomies/asset-tags.so400m.embeddings.json
    modality: [image]
  # ---------------------------------------------------------------------------
  # capability: asset-caption -- deep-tag captioner fallback (SBAI-7726 §5).
  #
  # Used only when Gemma 4 is not already cached: the deep tier prefers the
  # Gemma rows above (one multimodal model for chat AND captions beats a
  # second download). Florence-2 is task-prompted
  # (<CAPTION>/<MORE_DETAILED_CAPTION>/<OD>/<OCR>) with parsed regions via
  # post_process_generation -- structured output rather than free-form chat,
  # which is why it also covers OCR on sprite sheets and textures.
  #
  # Florence-2 is a MULTI-MODULE model (embed_tokens + vision_encoder +
  # encoder_model + decoder_model_merged), so `dtype` is the tier label and
  # f16 gate while `dtype_map` carries the per-module truth. The vision
  # encoder is conv-heavy: q4 quantizes MatMul only and buys nothing there,
  # hence fp16/int8 for that module in both tiers.
  #
  # NOT FastVLM: onnx-community/FastVLM-0.5B-ONNX is the better captioner and
  # has a working WebGPU demo, but its license is `apple-amlr`, not OSI. It
  # stays out of this Apache-2.0 catalog until that review lands (SBAI-7726).
  - id: on-device/florence-2-base-ft-fp16-webgpu
    source: huggingface://onnx-community/Florence-2-base-ft
    dtype: q4f16
    dtype_map:
      embed_tokens: fp16
      vision_encoder: fp16
      encoder_model: q4f16
      decoder_model_merged: q4f16
    device: webgpu
    min_ram_gb: 8
    approx_download_mb: 345
    capability: asset-caption
    max_output_tokens: 1024
    modality: [text, image]
    default: true
  - id: on-device/florence-2-base-ft-q8-wasm
    source: huggingface://onnx-community/Florence-2-base-ft
    dtype: q8
    dtype_map:
      embed_tokens: q8
      vision_encoder: q8
      encoder_model: q8
      decoder_model_merged: q8
    device: wasm
    min_ram_gb: 4
    approx_download_mb: 275
    capability: asset-caption
    max_output_tokens: 1024
    modality: [text, image]
  # ---------------------------------------------------------------------------
  # capability: stt -- Whisper dictation for the chat mic button (SBAI-7837).
  #
  # Repo: onnx-community/whisper-base. That id, not Xenova/whisper-base and not
  # whisper-base.en, because it is what Hugging Face's own reference demo loads
  # (Xenova/realtime-whisper-webgpu hardcodes `model_id =
  # "onnx-community/whisper-base"`), and because `.en` silently degrades every
  # non-English user. Xenova/whisper-base is additionally BROKEN for int8 --
  # encoder_model_int8.onnx is absent from its tree entirely.
  #
  # Whisper is a seq2seq model, so a row's real download is
  # encoder_model + decoder_model_merged, and the two quantize so differently
  # that a scalar dtype cannot describe a runnable tier. dtype_map carries the
  # truth; dtype stays the tier label and the f16 gate. The valid module keys
  # are exactly `encoder_model` and `decoder_model_merged` (transformers.js
  # src/models/session_config.js, MODEL_TYPES.Seq2Seq) -- a misspelt key does
  # not error, it silently falls back to the device default.
  #
  # Verified file sizes (huggingface.co/api/models/onnx-community/whisper-base
  # /tree/main/onnx?recursive=true, LFS `size`), in bytes:
  #     encoder_model.onnx                     82,468,078   (fp32)
  #     encoder_model_quantized.onnx           23,201,314   (q8)
  #     decoder_model_merged_q4.onnx          123,602,419   (q4)
  #     decoder_model_merged_quantized.onnx    53,693,315   (q8)
  # plus 2,769,562 B of tokenizer/config sidecars on every row.
  #
  # 🔴 COUNTERINTUITIVE AND LOAD-BEARING: q4 is LARGER than q8 for every
  # decoder in this family (123.6 MB vs 53.7 MB). Block-4-bit quantizes MatMul
  # weights only; the embedding table and lm_head stay wide. Do not "shrink" a
  # row by moving it to q4.
  #
  # There is NO q4f16 in this repo at all -- the only suffixes published are
  # fp32/fp16/int8/uint8/_quantized/_q4/_bnb4. A q4f16 row here would 404 after
  # the user had already waited for the rest of the download.
  - id: on-device/whisper-base-q4-webgpu
    source: huggingface://onnx-community/whisper-base
    dtype: q4
    dtype_map:
      encoder_model: fp32
      decoder_model_merged: q4
    device: webgpu
    min_ram_gb: 4
    approx_download_mb: 209
    capability: stt
    modality: [audio]
    default: true
  # ^ This mix is not a guess: it is byte-for-byte the configuration shipped in
  # the official Xenova/realtime-whisper-webgpu Space. Both halves are forced.
  #   * The decoder is q4 and NOT q8 because a q8 decoder on the WebGPU EP
  #     produces GIBBERISH while the same weights are correct on WASM
  #     (transformers.js #1317, reproduced across tiny/base/small/large-v3-
  #     turbo). Silent wrong output, not an error.
  #   * The encoder stays fp32 rather than fp16 because fp16 whisper encoders
  #     have an open precision bug on the v4 WebGPU EP (transformers.js #1590,
  #     still open) -- and fp32 also keeps this row off the `shader-f16` gate,
  #     so it runs on an adapter without that feature instead of dead-ending
  #     after the download (the SBAI-7682 rule).
  # KNOWN OPERATIONAL RISK, recorded rather than hidden: transformers.js #1739
  # (open, filed 2026-08-03) reports ~650 MB of GPU memory leaked per 30 s
  # window on exactly this {fp32, q4} configuration. Dictation utterances are
  # seconds long, which is why this ships; a long-file transcription feature
  # must not reuse this row without checking that issue first.
  #
  # The WASM tier. q4 has no ORT-web WASM kernel (the GatherBlockQuantized
  # doctrine from SBAI-7682), so this tier is plain per-tensor int8 -- `q8`
  # resolves to *_quantized.onnx.
  # `experimental` is not decoration: transformers.js #1707 (open) reports
  # `device: wasm` + `dtype: q8` failing at SESSION CREATION on 4.2.0 with
  #   qdq_actions.cc:137 TransposeDQWeightsForMatMulNBits Missing required
  #   scale: model.decoder.embed_tokens.weight_merged_0_scale
  # against a *_timestamped whisper repo. Byte-scanning every q8 decoder in
  # this family (onnx-community AND Xenova, all producer onnx.quantize 0.1.0)
  # found the identical QDQ graph markers, so the plain repos are very likely
  # affected too -- that is structural evidence, NOT a browser run, and nobody
  # has executed ORT-web against this row yet. The maintainer says 4.2.0 is the
  # last affected release ("fixed in v4.3.0"), which is not on npm. If it does
  # reproduce, the honest step-down is fp32 -- 82,468,078 + 208,521,528 +
  # sidecars = 293,759,168 B, ~294 MB, i.e. 3.7x this row but every tensor on a
  # standard op -- and NOT q4, which has no WASM kernel and is larger anyway.
  - id: on-device/whisper-base-q8-wasm
    source: huggingface://onnx-community/whisper-base
    dtype: q8
    dtype_map:
      encoder_model: q8
      decoder_model_merged: q8
    device: wasm
    min_ram_gb: 4
    approx_download_mb: 80
    capability: stt
    modality: [audio]
    experimental: true
  # NO larger "quality" tier, and that is a decision rather than an omission.
  # selectWeights ranks by min_ram_gb DESCENDING when the device reports its
  # RAM, so any row declaring a higher floor becomes the AUTO-SELECTED default
  # on every machine that clears it. The candidates were priced:
  #     onnx-community/distil-small.en   q8         172,068,091 B  (English-only,
  #                                                 862 downloads, untouched
  #                                                 since 2024-10-08)
  #     onnx-community/whisper-small     q8         249,077,005 B  (q8 decoder --
  #                                                 gibberish on WebGPU, #1317)
  #     onnx-community/whisper-small     fp32+q4    585,975,197 B
  # Making any of those the default would hand a 0.6 GB download to someone who
  # tapped a mic button to dictate one sentence. Whisper-base is the dictation
  # tier on purpose; a quality tier belongs to a transcription FEATURE, with
  # its own opt-in, not to this capability's ladder.
  # (onnx-community/distil-whisper-small.en, distil-medium.en and
  # distil-large-v3 were checked and DO NOT EXIST -- the HF API 401s on all
  # three. The real distil ONNX id is onnx-community/distil-small.en.)
