# Anthropic Messages API. Contract: https://docs.anthropic.com/en/api/messages
# Also send header `anthropic-version: 2023-06-01` on every request.
id: anthropic
kind: provider
display: Anthropic
wire: anthropic
base_url: https://api.anthropic.com
endpoint: /v1/messages
auth:
  header: x-api-key
  env: ANTHROPIC_API_KEY
request:
  method: POST
  body:
    model: "{{model}}"
    max_tokens: 1024
    messages: [{role: user, content: "{{prompt}}"}]
response:
  text_path: content.0.text
provides: [llm-chat]
billing: [byok]
requires:
  env: [ANTHROPIC_API_KEY]
models:
  endpoint: /v1/models
  refresh: 24h
chat:
  nativeChatPath: v1/messages
  modelPrefixes: [claude-]
slots:
  accepts: [text, image]
  emits: [text]
