# Anthropic Messages API. Contract: https://docs.anthropic.com/en/api/messages
id: anthropic
kind: provider
display: Anthropic
wire: openai-compat
engine:
  category: llm_router
  requirement: preferred
route: aigateway
starter: true
base_url: https://gateway.ai.cloudflare.com/v1/{{account_id}}/{{gateway_name}}/compat
endpoint: /chat/completions
response:
  text_path: choices.0.message.content
provides: [llm-chat]
billing: [brainbits, byok]
models:
  endpoint: /models
  refresh: 24h
chat:
  nativeChatPath: chat/completions
  modelPrefixes: [claude-]
slots:
  accepts: [text, image]
  emits: [text]
model_metadata:
  # https://platform.claude.com/docs/en/build-with-claude/context-windows
  # https://platform.claude.com/docs/en/build-with-claude/extended-thinking
  claude-sonnet-4-5-20250929:
    capabilities: [structured-output, tools, image-input]
    verified_for: [fusion, import]
    context_tokens: 200000
    max_output_tokens: 64000
