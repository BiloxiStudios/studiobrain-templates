# Anthropic Messages API. Contract: https://docs.anthropic.com/en/api/messages
id: anthropic
kind: provider
display: Anthropic
wire: openai-compat
route: aigateway
starter: true
base_url: https://gateway.ai.cloudflare.com/v1/{{account_id}}/{{gateway_name}}/compat
endpoint: /chat/completions
response:
  text_path: choices.0.message.content
provides: [llm-chat]
billing: [brainbits, byok]
models:
  endpoint: /models
  refresh: 24h
chat:
  nativeChatPath: chat/completions
  modelPrefixes: [claude-]
slots:
  accepts: [text, image]
  emits: [text]
